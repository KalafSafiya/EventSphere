{% extends "base.html" %}

{% block title %}Staff Check-in | EventSphere{% endblock %}

{% block content %}
<section class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">

                    <h2 class="fw-bold mb-2">Ticket Check-in</h2>
                    <p class="text-muted mb-4">
                        Validate attendee tickets at the event entrance.
                    </p>

                    <div id="staffAccessMessage" class="mb-3" role="status"></div>

                    <form id="checkinForm">
                        <div class="mb-3">
                            <label for="checkinEvent" class="form-label fw-semibold">
                                Select Event
                            </label>

                            <select id="checkinEvent" class="form-select" required>
                                <option value="">
                                    Loading events...
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="qrToken" class="form-label fw-semibold">
                                QR Token
                            </label>

                            <input type="text" id="qrToken" class="form-control"
                                placeholder="Scan or paste ticket QR token" minlength="10" autocomplete="off" required>

                            <div class="form-text">
                                Use a QR scanner that enters the decoded
                                token into this field.
                            </div>
                        </div>

                        <button type="submit" id="checkinButton" class="btn btn-primary btn-lg w-100">
                            Validate and Check In
                        </button>
                    </form>

                    <div id="checkinResult" class="mt-4" role="status" aria-live="polite"></div>

                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
