{% extends "base.html" %}

{% block title %}Login | EventSphere{% endblock %}

{% block content %}
<section class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h2 class="fw-bold mb-2">Welcome Back</h2>
                    <p class="text-muted mb-4">
                        Log in to manage your EventSphere bookings.
                    </p>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">
                                Email Address
                            </label>
                            <input type="email" id="loginEmail" class="form-control" autocomplete="email" required>
                        </div>

                        <div class="mb-4">
                            <label for="loginPassword" class="form-label">
                                Password
                            </label>
                            <input type="password" id="loginPassword" class="form-control"
                                autocomplete="current-password" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100" id="loginButton">
                            Login
                        </button>
                    </form>

                    <div id="loginMessage" class="mt-3" role="alert" aria-live="polite"></div>

                    <p class="text-center mt-4 mb-0">
                        Don't have an account?
                        <a href="/register">Register</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
