{% extends "base.html" %}

{% block title %}Complete Payment | EventSphere{% endblock %}

{% block content %}
<section class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h2 class="fw-bold">Complete Your Booking</h2>
                    <p class="text-muted">
                        EventSphere simulated payment checkout
                    </p>

                    <div class="alert alert-info">
                        This is a demonstration. No real money
                        will be charged.
                    </div>

                    <h5 id="paymentBookingId"></h5>
                    <p id="paymentStatus">Ready to simulate payment.</p>

                    <button id="payNowButton" class="btn btn-success btn-lg w-100" type="button">
                        Simulate Successful Payment
                    </button>

                    <div id="paymentMessage" class="mt-3" role="status" aria-live="polite"></div>

                    <a href="/my-tickets" class="btn btn-outline-primary w-100 mt-3">
                        View My Tickets
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
