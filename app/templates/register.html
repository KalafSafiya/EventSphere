{% extends "base.html" %}

{% block title %}Register | EventSphere{% endblock %}

{% block content %}
<section class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h2 class="fw-bold mb-2">Create Account</h2>
                    <p class="text-muted mb-4">
                        Join EventSphere and discover exciting events.
                    </p>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="registerName" class="form-label">
                                Full Name
                            </label>
                            <input type="text" id="registerName" class="form-control" minlength="2" maxlength="100"
                                autocomplete="name" required>
                        </div>

                        <div class="mb-3">
                            <label for="registerEmail" class="form-label">
                                Email Address
                            </label>
                            <input type="email" id="registerEmail" class="form-control" autocomplete="email" required>
                        </div>

                        <div class="mb-4">
                            <label for="registerPassword" class="form-label">
                                Password
                            </label>
                            <input type="password" id="registerPassword" class="form-control" minlength="8"
                                maxlength="128" autocomplete="new-password" required>
                            <div class="form-text">
                                Use at least 8 characters.
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100" id="registerButton">
                            Create Account
                        </button>
                    </form>

                    <div id="registerMessage" class="mt-3" role="alert" aria-live="polite"></div>

                    <p class="text-center mt-4 mb-0">
                        Already have an account?
                        <a href="/login">Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
